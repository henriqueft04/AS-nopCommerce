# Observability stack for nopCommerce instrumentation
#
# Services:
#   otel-collector  — receives OTLP from the app, fans out to Jaeger + Prometheus
#   jaeger          — trace storage and UI  (http://localhost:16686)
#   prometheus      — metrics scraping      (http://localhost:9090)
#   grafana         — dashboards            (http://localhost:3000, admin/admin)

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: noproot
      MYSQL_DATABASE: nopcommerce
      MYSQL_USER: nop
      MYSQL_PASSWORD: noppassword
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC (app → collector)
      - "4318:4318"   # OTLP HTTP  (app → collector)
      - "8889:8889"   # Prometheus scrape endpoint (collector → prometheus)
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"   # Jaeger UI
      - "4320:4317"     # OTLP gRPC from collector (internal)
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger
    restart: unless-stopped

volumes:
  grafana-storage:
  mysql-data:
